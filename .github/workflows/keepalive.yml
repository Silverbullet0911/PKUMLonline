name: supabase keepalive

# 免费版 Supabase 连续 7 天无 API 请求会被自动暂停，此工作流每 3 天 ping 一次 REST API 保活。
on:
  schedule:
    - cron: '0 4 */3 * *' # 每月 1/4/7/10/13/... 日凌晨 4 点（UTC），约每 3 天一次
  workflow_dispatch: {}   # 支持手动触发（仓库页 Actions → supabase keepalive → Run workflow）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/games?select=id&limit=1")
          echo "Supabase responded with HTTP $code"
          # 200/206 都算成功；4xx 说明 secrets 配置有问题，让任务失败以便发现
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then exit 1; fi
